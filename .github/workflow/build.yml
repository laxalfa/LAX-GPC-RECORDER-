name: LAX GAME RECORDER - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project Files
        shell: bash
        run: |
          set -e
          echo "Checking Android project..."

          if [ ! -f "./gradlew" ]; then
            echo "::error::Gradle wrapper not found at repository root."
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          chmod +x ./gradlew
          echo "Project structure check completed."

      - name: Check Package Configuration
        shell: bash
        run: |
          echo "Expected Android application ID: com.lax.recorder"
          echo "The application module must configure:"
          echo "applicationId = \"com.lax.recorder\""
          echo "Verify the actual Gradle configuration before release."

      - name: Validate Gradle Configuration
        run: ./gradlew --no-daemon help

      - name: Run Unit Tests
        run: ./gradlew --no-daemon test

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate Generated APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_PATH="$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/LAX-GAME-RECORDER-debug.apk

          echo "path=release/LAX-GAME-RECORDER-debug.apk" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAX-GAME-RECORDER-Android-APK
          path: release/LAX-GAME-RECORDER-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: success()
        run: |
          echo "## LAX GAME RECORDER - Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package ID: com.lax.recorder" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: LAX-GAME-RECORDER-Android-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the workflow run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
